# Provectus kafka-ui — web UI to browse topics, messages, consumer groups.
# Internal-only; expose via `kubectl port-forward`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "relay"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "relay-kafka:9092"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: relay
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080

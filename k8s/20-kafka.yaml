# Kafka = StatefulSet (not Deployment) because:
#  1. Each broker needs a STABLE NETWORK IDENTITY (e.g. relay-kafka-0).
#     Deployments give you random pod names; consumers can't address a
#     specific broker. StatefulSets give pod-0, pod-1, ... predictably.
#  2. Each broker has STORAGE PER POD (volumeClaimTemplates auto-creates
#     a PVC per replica). Deployment replicas all share the same template
#     and can't have per-pod state.
#  3. Brokers come up in ORDER (0 before 1 before 2). Useful for clustered
#     systems that need a leader.
#
# StatefulSet always has a corresponding HEADLESS SERVICE (clusterIP: None)
# so DNS gives you per-pod addresses like relay-kafka-0.relay-kafka.relay.svc.
apiVersion: v1
kind: Service
metadata:
  name: relay-kafka
  namespace: relay
spec:
  clusterIP: None  # headless — pod-specific DNS
  selector:
    app: relay-kafka
  ports:
    - port: 9092
      name: kafka
    - port: 9093
      name: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay-kafka
  namespace: relay
spec:
  serviceName: relay-kafka  # references the headless service above
  replicas: 1                # single broker for the demo
  selector:
    matchLabels:
      app: relay-kafka
  template:
    metadata:
      labels:
        app: relay-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Other pods reach Kafka via the K8s Service DNS name.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://relay-kafka.relay.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qg"

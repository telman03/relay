# Secret = ConfigMap for sensitive data. Stored base64-encoded
# (NOT encrypted at rest by default — that requires KMS / SealedSecrets / Vault).
# Talk track for interview: "Secrets aren't really secret without encryption-at-rest;
# in production I'd use a sealed-secrets controller, External Secrets Operator,
# or pull from Vault."
#
# This is a demo: the value is just "demo-api-key" base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: relay-secrets
  namespace: relay
type: Opaque
data:
  API_KEY: ZGVtby1hcGkta2V5  # echo -n "demo-api-key" | base64
